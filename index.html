<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemur Net - Wyszukiwarka & DNS</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --dns-color: #4ade80;
            --error-color: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 14px 24px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .logo { font-size: 1.3rem; font-weight: 900; color: var(--accent-color); text-decoration: none; }

        .stat-badge {
            background-color: var(--bg-color);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .stat-badge strong { color: var(--accent-color); }

        .search-container { max-width: 800px; width: 100%; margin: 30px auto 6px auto; padding: 0 20px; }

        .search-box {
            display: flex;
            gap: 10px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 16px;
        }
        .search-box:focus-within { border-color: var(--accent-color); }

        .search-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-color); font-size: 1rem; }

        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; cursor: default; }

        .hint { max-width: 800px; margin: 0 auto; padding: 0 24px; font-size: 0.75rem; color: var(--text-muted); }

        .results-container { max-width: 800px; width: 100%; margin: 0 auto; padding: 0 20px 40px 20px; display: none; }

        .dns-card { background: rgba(74, 222, 128, 0.08); border: 1px solid var(--dns-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: none; }
        .dns-title { color: var(--dns-color); font-weight: bold; font-size: 0.9rem; margin-bottom: 6px; }
        .dns-ip { font-family: monospace; font-size: 1.2rem; color: #ffffff; }

        .result-card { margin-bottom: 18px; }
        .result-url { font-size: 0.8rem; color: var(--text-muted); }
        .result-title { font-size: 1.1rem; color: var(--accent-color); text-decoration: none; font-weight: 600; }
        .result-title:hover { text-decoration: underline; }
        .result-snippet { font-size: 0.9rem; margin-top: 4px; line-height: 1.4; }
        .result-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">🔍 Lemur Net</a>
    </header>

    <div class="search-container">
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Wyszukaj w LemurNet" maxlength="200" onkeypress="if(event.key==='Enter') executeSearch()">
            <button class="btn" id="searchBtn" onclick="executeSearch()">Szukaj</button>
        </div>
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="dns-card" id="dnsBox">
            <div class="dns-title" id="dnsTitle">DNS (z pliku)</div>
            <div id="dnsInfo"></div>
        </div>
        <div id="resultsList"></div>
    </div>

    <script>
        let searchIndex = [];
        let dnsIndex = new Map();

        async function loadData() {
            try {
                const [dbRes, dnsRes] = await Promise.all([
                    fetch('db.json?t=' + Date.now()),
                    fetch('dns.json?t=' + Date.now())
                ]);
                searchIndex = await dbRes.json();
                const dnsList = await dnsRes.json();
                dnsIndex = new Map(dnsList.map(e => [e.domain, e.ip]));
            } catch (err) {
                console.error('Błąd ładowania danych:', err);
            }
        }
        loadData();

        function hasScheme(input) {
            return /^https?:\/\//i.test(input);
        }

        function isBareDomain(input) {
            const domainPattern = /^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$/i;
            return domainPattern.test(input);
        }

        function renderResults(results) {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';
            if (results.length === 0) {
                const p = document.createElement('p');
                p.style.color = 'var(--text-muted)';
                p.textContent = 'Brak wyników w LemurNet.';
                resultsList.appendChild(p);
                return;
            }
            for (const r of results) {
                const card = document.createElement('div');
                card.className = 'result-card';

                const urlDiv = document.createElement('div');
                urlDiv.className = 'result-url';
                urlDiv.textContent = r.url;

                const titleLink = document.createElement('a');
                titleLink.className = 'result-title';
                titleLink.href = r.url;
                titleLink.target = '_blank';
                titleLink.rel = 'noopener noreferrer';
                titleLink.textContent = r.title;

                const snippetDiv = document.createElement('div');
                snippetDiv.className = 'result-snippet';
                snippetDiv.textContent = r.snippet;

                card.append(urlDiv, titleLink, snippetDiv);
                resultsList.appendChild(card);
            }
        }

        function showDnsLookup(domain) {
            const dnsBox = document.getElementById('dnsBox');
            const dnsInfo = document.getElementById('dnsInfo');
            const ip = dnsIndex.get(domain);

            dnsBox.style.display = 'block';
            dnsInfo.innerHTML = '';
            if (ip) {
                dnsInfo.append('Domena: ');
                const b = document.createElement('b'); b.textContent = domain;
                dnsInfo.append(b, ' ➔ IP: ');
                const span = document.createElement('span'); span.className = 'dns-ip'; span.textContent = ip;
                dnsInfo.append(span);
            } else {
                dnsInfo.textContent = 'Brak ' + domain + ' w lokalnej bazie DNS.';
            }
        }

        function executeSearch() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            if (!rawQuery) return;

            // Pełny URL ze schematem -> przekierowanie, koniec
            if (hasScheme(rawQuery)) {
                window.location.href = rawQuery;
                return;
            }

            const container = document.getElementById('resultsContainer');
            const dnsBox = document.getElementById('dnsBox');
            const resultsList = document.getElementById('resultsList');
            const searchBtn = document.getElementById('searchBtn');

            container.style.display = 'block';
            dnsBox.style.display = 'none';
            searchBtn.disabled = true;

            resultsList.innerHTML = '<span class="spinner"></span><span class="loading-text">Szukam...</span>';

            const delay = 350 + Math.random() * 450; // 350-800ms, wygląda naturalnie
            setTimeout(() => {
                if (isBareDomain(rawQuery)) {
                    showDnsLookup(rawQuery.toLowerCase());
                }

                const query = rawQuery.toLowerCase();
                const results = searchIndex.filter(item =>
                    (item.title || '').toLowerCase().includes(query) ||
                    (item.snippet || '').toLowerCase().includes(query) ||
                    (item.content || '').toLowerCase().includes(query) ||
                    (item.url || '').toLowerCase().includes(query)
                );
                renderResults(results);
                searchBtn.disabled = false;
            }, delay);
        }
    </script>
</body>
</html>
