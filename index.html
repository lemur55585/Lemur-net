<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemur Net - Wyszukiwarka & DNS</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --dns-color: #4ade80;
            --error-color: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 14px 24px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .logo { font-size: 1.3rem; font-weight: 900; color: var(--accent-color); text-decoration: none; }

        .stat-badge {
            background-color: var(--bg-color);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .stat-badge strong { color: var(--accent-color); }

        .search-container { max-width: 800px; width: 100%; margin: 30px auto 6px auto; padding: 0 20px; }

        .search-box {
            display: flex;
            gap: 10px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 16px;
        }
        .search-box:focus-within { border-color: var(--accent-color); }

        .search-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-color); font-size: 1rem; }

        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; cursor: default; }

        .hint { max-width: 800px; margin: 0 auto; padding: 0 24px; font-size: 0.75rem; color: var(--text-muted); }

        .results-container { max-width: 800px; width: 100%; margin: 0 auto; padding: 0 20px 40px 20px; display: none; }

        .ai-overview { background: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .ai-header { font-weight: bold; color: var(--accent-color); margin-bottom: 8px; }

        .result-card { margin-bottom: 18px; }
        .result-url { font-size: 0.8rem; color: var(--text-muted); }
        .result-title { font-size: 1.1rem; color: var(--accent-color); text-decoration: none; font-weight: 600; }
        .result-title:hover { text-decoration: underline; }
        .result-snippet { font-size: 0.9rem; margin-top: 4px; line-height: 1.4; }
        .result-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">🔍 Lemur Net</a>
        <div class="stat-badge">Strony w indeksie: <strong id="pagesCount">Ładowanie...</strong></div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Wpisz domenę (np. lemurhost.pl) lub szukaj w indeksie..." maxlength="200" onkeypress="if(event.key==='Enter') executeSearch()">
            <button class="btn" id="searchBtn" onclick="executeSearch()">Szukaj</button>
        </div>
    </div>
    <p class="hint">Wyszukiwanie przeszukuje lokalną bazę (db.json) zebraną przez crawler.</p>

    <div class="results-container" id="resultsContainer">
        <div class="ai-overview">
            <div class="ai-header">🤖 Podsumowanie</div>
            <div class="ai-body" id="aiAnswer">Przetwarzanie zapytania...</div>
        </div>

        <div id="resultsList"></div>
    </div>

    <script>
        let searchIndex = [];
        let searchDebounceTimer = null;

        // Zapobiega XSS: każdy fragment tekstu pochodzący z bazy lub od użytkownika
        // trafia do DOM przez textContent, nigdy przez innerHTML z surowym stringiem.
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function loadDatabase() {
            try {
                // cache-bust: GitHub Pages / przeglądarka potrafią serwować stary plik
                const res = await fetch('db.json?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                searchIndex = await res.json();
                document.getElementById('pagesCount').textContent = searchIndex.length;
            } catch (err) {
                document.getElementById('pagesCount').textContent = 'błąd ładowania';
            }
        }
        loadDatabase();


        async function executeSearch() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            if (!rawQuery) return;
            const query = rawQuery.toLowerCase();

            const container = document.getElementById('resultsContainer');
            const aiAnswer = document.getElementById('aiAnswer');
            const resultsList = document.getElementById('resultsList');
            const searchBtn = document.getElementById('searchBtn');

            searchBtn.disabled = true;
            container.style.display = 'block';

            // KROK 1: najpierw baza - wynik pojawia się od razu, bez czekania na sieć
            const results = searchIndex.filter(item =>
                (item.title || '').toLowerCase().includes(query) ||
                (item.snippet || '').toLowerCase().includes(query) ||
                (item.url || '').toLowerCase().includes(query)
            );

            aiAnswer.textContent = results.length > 0
                ? `Znaleziono ${results.length} wpis(ów) dla "${rawQuery}". Najlepsze dopasowanie: ${results[0].title}`
                : `Brak wpisów w indeksie dla "${rawQuery}".`;

            resultsList.innerHTML = '';
            if (results.length === 0) {
                const p = document.createElement('p');
                p.style.color = 'var(--text-muted)';
                p.style.marginTop = '15px';
                p.textContent = 'Brak bezpośrednich stron w indeksie.';
                resultsList.appendChild(p);
            }

            for (const r of results) {
                const card = document.createElement('div');
                card.className = 'result-card';

                const urlDiv = document.createElement('div');
                urlDiv.className = 'result-url';
                urlDiv.textContent = r.url;

                const titleLink = document.createElement('a');
                titleLink.className = 'result-title';
                titleLink.href = r.url;
                titleLink.target = '_blank';
                titleLink.rel = 'noopener noreferrer';
                titleLink.textContent = r.title;

                const snippetDiv = document.createElement('div');
                snippetDiv.className = 'result-snippet';
                snippetDiv.textContent = r.snippet;

                card.append(urlDiv, titleLink, snippetDiv);

                if (r.indexed_at) {
                    const timeDiv = document.createElement('div');
                    timeDiv.className = 'result-time';
                    timeDiv.textContent = 'Zaindeksowano: ' + new Date(r.indexed_at).toLocaleString('pl-PL');
                    card.appendChild(timeDiv);
                }

                resultsList.appendChild(card);
            }

            searchBtn.disabled = false;
        }
    </script>
</body>
</html>
